[package]
name = "gitcrack"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for reviewing git diffs, commits, branches, and pull requests"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
